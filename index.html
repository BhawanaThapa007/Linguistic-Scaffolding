<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elementary Symphony</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6f8;margin:0;color:#222}
.c{max-width:560px;margin:0 auto;padding:1rem;text-align:center}
.s{color:#888;font-size:.85rem;margin-bottom:.5rem}
.q{font-size:1.2rem;font-style:italic;background:#fff;border-radius:12px;padding:1.2rem;margin:.5rem 0;line-height:1.6}
.p{background:#fff8e1;border:2px solid #f39c12;border-radius:10px;padding:.7rem;margin:.5rem 0;text-align:left}
.e{font-size:3rem}
.o,.m,.b,.h{font-size:1rem;border:2px solid #2E4057;background:#fff;color:#2E4057;border-radius:10px;padding:.6rem 1rem;margin:.3rem;cursor:pointer}
.o{display:block;width:100%}
.b{background:#2E4057;color:#fff}.h{border-color:#f39c12;color:#b9770e}
.m.on{background:#2E4057;color:#fff}
.o.ok{background:#27ae60;color:#fff;border-color:#27ae60}.o.no{background:#e74c3c;color:#fff;border-color:#e74c3c}
.n{padding:.6rem;border-radius:8px;margin:.5rem 0}.g{background:#e8f8ee}.r{background:#fdecea}
.pulse{animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.08)}}
input{font-size:1.1rem;padding:.5rem;border:2px solid #ccc;border-radius:8px;margin:.5rem}
</style></head><body><div id="app"></div>
<script src="vocab-data.js"></script><script src="arm.js"></script><script src="scaffolds.js"></script><script src="app.js"></script>
</body></html>
